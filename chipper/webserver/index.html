<!DOCTYPE html>
<html>

<head>
  <title>小丸控制台</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="stylesheet" type="text/css" href="css/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="https://kit.fontawesome.com/7508f396ac.js" crossorigin="anonymous"></script>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
</head>

<body>
  <div id="outer">
    <div id="content" class="page-shell minimal-shell">
      <section class="minimal-topbar">
        <div class="minimal-titleblock">
          <p class="minimal-kicker">Xiao Wan</p>
          <h1>控制台</h1>
          <p class="minimal-copy">核心入口都在这里。</p>
        </div>
        <div class="minimal-statusblock">
          <p class="minimal-label">在线状态</p>
          <div id="botStats"></div>
        </div>
      </section>

      <section class="minimal-section">
        <div class="minimal-section-head">
          <h2>主入口</h2>
        </div>
        <div class="minimal-linklist">
          <a class="minimal-linkcard" href="setup.html">
            <span class="minimal-linkicon"><i class="fa-solid fa-gear"></i></span>
            <span class="minimal-linkbody">
              <strong>服务设置</strong>
              <small>模型、记忆、天气</small>
            </span>
            <span class="minimal-linkarrow">↗</span>
          </a>
          <a class="minimal-linkcard" href="/sdkapp">
            <span class="minimal-linkicon"><i class="fa-solid fa-toolbox"></i></span>
            <span class="minimal-linkbody">
              <strong>机器人</strong>
              <small>接入、控制、本体设置</small>
            </span>
            <span class="minimal-linkarrow">↗</span>
          </a>
          <a class="minimal-linkcard" href="#" onclick="showLog(); return false;">
            <span class="minimal-linkicon"><i class="fa-solid fa-file-lines" id="icon-Logs" name="icon"></i></span>
            <span class="minimal-linkbody">
              <strong>运行日志</strong>
              <small>对话、动作、连接日志</small>
            </span>
            <span class="minimal-linkarrow">展开</span>
          </a>
        </div>
      </section>

      <section class="minimal-section minimal-section-subtle">
        <div class="minimal-section-head minimal-section-head-inline">
          <h2>辅助入口</h2>
          <a href="#" onclick="showBotAuth(); return false;">
            <i class="fa-solid fa-robot" id="icon-BotAuth" name="icon"></i>
            <span>机器人接入 / OSKR</span>
          </a>
        </div>
      </section>

      <div id="section-botauth" style="display: none">
        <div class="section-panel section-stack section-panel-wide minimal-panel structured-panel">
          <div class="minimal-panel-head">
            <h2>机器人接入</h2>
            <p>量产机认证，或给 OSKR / 开发机做 SSH 预配置。</p>
          </div>
          <div class="minimal-two-col">
            <div class="minimal-cardblock">
              <p class="minimal-label">连接状态</p>
              <div id="disconnectButton"></div>
              <div id="botAuth"></div>
            </div>
            <div class="minimal-cardblock">
              <p class="minimal-label">SSH 预设置</p>
              <div id="oskrSetupProgress"></div>
              <div id="oskrSetup" class="stack-tight">
                <input class="tinput" type="text" id="sshIp" name="sshIp" placeholder="机器人 IP 地址" />
                <input type="file" id="sshKeyFile" name="sshKeyFile" />
                <div class="panel-actions">
                  <button onclick="doSSHSetup()">开始设置</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="section-log" style="display: none">
        <div class="section-panel section-stack section-panel-wide minimal-panel structured-panel">
          <div class="minimal-panel-head">
            <h2>运行日志</h2>
            <p>实时查看语音、动作和连接输出。</p>
          </div>
          <div class="toolbar-inline minimal-toolbar">
            <label class="toggle-line" for="logdebug">
              <input id="logdebug" name="logdebug" type="checkbox" />
              <span>显示全部日志</span>
            </label>
            <label class="toggle-line" for="logscrollbottom">
              <input id="logscrollbottom" name="logscrollbottom" type="checkbox" />
              <span>自动滚动到底部</span>
            </label>
          </div>
          <textarea id="botTranscriptedTextArea" rows="7" cols="50">正在加载日志...</textarea>
        </div>
      </div>
    </div>
  </div>
</body>

<script src="./js/main.js"></script>
<script src="./js/ble.js"></script>
<script src="./js/ssh.js"></script>
<script src="./sdkapp/js/common.js"></script>
<script src="./js/battery.js"></script>
<script>
  checkInited();
  processBotStats();
</script>

</html>
