<!DOCTYPE html>
<html>

<head>
  <title>小丸设备控制</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="stylesheet" type="text/css" href="../css/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/7508f396ac.js" crossorigin="anonymous"></script>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
</head>

<body onload="updateControlButtons()">
  <div id="outer">
    <div id="content" class="page-shell minimal-shell">
      <section class="minimal-section">
        <div class="settings-actionbar">
          <a href="#panel-camera" class="settings-jump"><i class="fa-solid fa-camera"></i><span>摄像头</span></a>
          <a href="#panel-control" class="settings-jump"><i class="fa-solid fa-gamepad"></i><span>行为控制</span></a>
          <a href="#panel-audio" class="settings-jump"><i class="fa-solid fa-volume-high"></i><span>播报与音频</span></a>
        </div>
      </section>

      <div class="minimal-sdk-grid control-panel-stack" id="sdkActions">
        <section class="minimal-panel simple-panel" id="panel-camera">
          <div class="minimal-panel-head">
            <h2>摄像头</h2>
            <p>先看画面，再做控制。</p>
          </div>
          <div class="sdk-preview minimal-preview" id="camStream">
            <div class="sdk-empty-state">未开启视频流时，这里会显示设备画面。</div>
          </div>
          <div class="sdk-option-list dual-option-list compact-option-list">
            <label><input type="radio" name="cam" id="cam_on" onclick="showCamStream()">开始视频流</label>
            <label><input type="radio" name="cam" id="cam_off" onclick="stopCamStream()" checked>停止视频流</label>
          </div>
        </section>

        <section class="minimal-panel simple-panel" id="panel-control">
          <div class="minimal-panel-head">
            <h2>行为控制</h2>
            <p>多数动作前要先接管。</p>
          </div>
          <div class="sdk-option-list dual-option-list compact-option-list">
            <label><input type="radio" name="control" id="assume_control"
                onclick="sendForm('/api-sdk/assume_behavior_control?priority=high'); updateControlButtons();">接管</label>
            <label><input type="radio" name="control" id="release_control"
                onclick="sendForm('/api-sdk/release_behavior_control'); updateControlButtons();" checked>释放</label>
          </div>
          <div class="sdk-option-list dual-option-list compact-option-list">
            <label><input type="radio" name="keycontrol" id="key_control_on" onclick="toggleKeyboard()" disabled>开启键盘控制</label>
            <label><input type="radio" name="keycontrol" id="key_control_off" onclick="toggleKeyboard()" checked disabled>关闭键盘控制</label>
          </div>
          <div class="sdk-option-list dual-option-list compact-option-list">
            <label><input type="radio" name="mirror" id="mirror_on" onclick="sendForm('/api-sdk/mirror_mode?enable=true')" disabled>开启镜像模式</label>
            <label><input type="radio" name="mirror" id="mirror_off" onclick="sendForm('/api-sdk/mirror_mode?enable=false')" checked disabled>关闭镜像模式</label>
          </div>
          <div class="sdk-keymap" id="keysKey" style="display: none;">
            <p class="sdk-note">W / A / S / D 控轮子，R / F 控手臂，T / G 控头部。</p>
          </div>
        </section>

        <section class="minimal-panel simple-panel" id="panel-audio">
          <div class="minimal-panel-head">
            <h2>播报与音频</h2>
            <p>验证文本和 wav 回放。</p>
          </div>
          <div class="sdk-form-stack compact-stack">
            <label for="textSay">让机器人说一句话</label>
            <input class="tinput" name="textSay" id="textSay" type="text" placeholder="输入要让机器人说的话" disabled />
            <div class="panel-actions">
              <button onclick="sayText()" type="submit">发送文本</button>
            </div>
          </div>
          <div class="sdk-form-stack compact-stack">
            <label for="fileInput">发送 wav 音频</label>
            <input type="file" id="fileInput" accept=".wav">
            <div class="panel-actions">
              <button id="uploadButton" style="display: none;" type="submit">发送音频</button>
            </div>
            <audio id="audioOutput" controls></audio>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="./js/httprequest.js"></script>
  <script src="./js/iro.min.js"></script>
  <script src="./js/control.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/play_audio.js"></script>

  <iframe name="hiddenFrame" width="0" height="0" border="0" style="display: none"></iframe>
</body>

</html>
