<!DOCTYPE html>
<html>

<head>
  <title>小丸设备接入</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="stylesheet" type="text/css" href="../css/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/7508f396ac.js" crossorigin="anonymous"></script>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
</head>

<body>
  <div id="outer">
    <div id="content" class="page-shell minimal-shell">
      <section class="minimal-topbar minimal-topbar-tight">
        <div class="minimal-titleblock">
          <p class="minimal-kicker">Xiao Wan</p>
          <h1>设备接入</h1>
          <p class="minimal-copy">先选机器人，再进入控制或设置页面。</p>
        </div>
        <div class="minimal-statusblock minimal-backblock">
          <a class="setup-back-link" href="../index.html">
            <i class="fa-solid fa-reply"></i>
            <span>返回控制台</span>
          </a>
        </div>
      </section>

      <section class="minimal-section">
        <div class="minimal-panel simple-panel">
          <div class="minimal-panel-head">
            <h2>选择机器人</h2>
            <p>建立 SDK 会话后，再进入设备页。</p>
          </div>
          <div class="minimal-cardblock compact-cardblock">
            <label for="botList">已发现设备</label>
            <select id="botList" name="botList"></select>
            <div class="panel-actions">
              <button onclick="connectSDK()">连接设备</button>
            </div>
            <div id="authResult"></div>
          </div>
        </div>
      </section>
    </div>
  </div>
  <iframe name="hiddenFrame" width="0" height="0" border="0" style="display: none"></iframe>
  <script src="./js/httprequest.js"></script>
  <script src="./js/common.js"></script>
  <script src="../js/ui.js"></script>
  <script src="./js/auth.js"></script>
</body>

</html>
