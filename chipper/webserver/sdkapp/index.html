<!DOCTYPE html>
<html>

<head>
  <title>小丸设备接入</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="stylesheet" type="text/css" href="../css/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/7508f396ac.js" crossorigin="anonymous"></script>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
</head>

<body>
  <div id="outer">
    <div id="content" class="page-shell minimal-shell">
      <section class="minimal-topbar minimal-topbar-tight">
        <div class="minimal-titleblock">
          <p class="minimal-kicker">Xiao Wan</p>
          <h1>设备接入</h1>
          <p class="minimal-copy">选设备，再进入控制或设置。</p>
        </div>
        <div class="minimal-statusblock minimal-backblock">
          <a class="setup-back-link" href="../index.html">
            <i class="fa-solid fa-reply"></i>
            <span>返回控制台</span>
          </a>
        </div>
      </section>

      <section class="minimal-section">
        <div class="settings-actionbar">
          <a href="#" onclick="window.location.reload(); return false;" class="minimal-tab"><i class="fa-solid fa-rotate-right"></i><span>刷新设备列表</span></a>
        </div>
      </section>

      <section class="minimal-section">
        <div class="settings-launcher-grid">
          <article class="settings-group-card">
            <p class="minimal-label">Connect</p>
            <h2>选择机器人</h2>
            <p>先确认设备在线，再进入设置页。</p>
            <label for="botList">设备列表</label>
            <select id="botList" name="botList"></select>
            <div class="panel-actions">
              <button onclick="connectSDK()">进入设备</button>
            </div>
            <div id="authResult" class="status-card"></div>
          </article>

          <article class="settings-group-card">
            <p class="minimal-label">Next</p>
            <h2>连接后去哪</h2>
            <p>连接成功后会先进入设备设置页，音量、人脸、动作、时间等都在那里统一管理。</p>
            <div class="settings-chiplist">
              <span class="settings-note-chip">设备设置</span>
              <span class="settings-note-chip">设备控制</span>
            </div>
          </article>
        </div>
      </section>
    </div>
  </div>
  <iframe name="hiddenFrame" width="0" height="0" border="0" style="display: none"></iframe>
  <script src="./js/httprequest.js"></script>
  <script src="./js/common.js"></script>
  <script src="../js/ui.js"></script>
  <script src="./js/auth.js"></script>
</body>

</html>
