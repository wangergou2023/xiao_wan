<!DOCTYPE html>
<html>

<head>
  <title>小丸设备接入</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="stylesheet" type="text/css" href="../css/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/7508f396ac.js" crossorigin="anonymous"></script>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
</head>

<body>
  <div id="outer">
    <div id="content" class="page-shell">
      <section class="home-hero">
        <div class="hero-copy hero-copy-rich">
          <p class="hero-badge">Xiao Wan Device Access</p>
          <h1>小丸设备接入</h1>
          <p class="hero-subtitle">这里专门负责设备侧会话：从已发现的机器人里选一台，连上后进入本体设置或控制页面。</p>
          <div class="hero-pills">
            <span>选择设备</span>
            <span>建立 SDK 会话</span>
            <span>进入设备页</span>
          </div>
        </div>
        <div class="hero-status-card setup-status-card">
          <p class="hero-status-label">返回入口</p>
          <a class="setup-back-link" href="../index.html">
            <i class="fa-solid fa-reply"></i>
            <span>返回控制台首页</span>
          </a>
          <div class="hero-note-list">
            <p>这里只做设备选择，不堆设备细节。</p>
            <p>连接后再进入具体控制与设置页面。</p>
          </div>
        </div>
      </section>

      <section class="section-panel story-card">
        <div class="section-heading section-heading-inline">
          <div>
            <p class="section-kicker">Device Session</p>
            <h2>选择机器人</h2>
          </div>
          <p>选中一台机器人后点击连接，即可进入设备侧设置与控制页面。</p>
        </div>
        <div class="editorial-grid align-start-grid">
          <div class="fieldset-card stack-tight">
            <label for="botList">已发现设备</label>
            <select id="botList" name="botList"></select>
            <div class="panel-actions">
              <button onclick="connectSDK()">连接设备</button>
            </div>
          </div>
          <div class="mini-card mini-card-note">
            <p class="section-kicker">What you can do next</p>
            <ul class="feature-list compact-list">
              <li>进入设备设置页改音量、眼睛颜色、人脸和照片。</li>
              <li>进入控制页调试相机、行为控制和播报。</li>
              <li>所有原有 JS 钩子保持不变，只是布局重做了。</li>
            </ul>
          </div>
        </div>
        <div id="authResult"></div>
      </section>
    </div>
  </div>
  <iframe name="hiddenFrame" width="0" height="0" border="0" style="display: none"></iframe>
  <script src="./js/httprequest.js"></script>
  <script src="./js/common.js"></script>
  <script src="../js/ui.js"></script>
  <script src="./js/auth.js"></script>
</body>

</html>
