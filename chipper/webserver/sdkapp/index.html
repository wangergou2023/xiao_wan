<!DOCTYPE html>
<html>

<head>
  <title>小丸设备接入</title>
  <!-- Meta Apple tags for a PWA like experience. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="stylesheet" type="text/css" href="../css/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/7508f396ac.js" crossorigin="anonymous"></script>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
</head>

<body>
  <div id="outer">
    <div id="content">
      <section class="home-hero">
        <div class="hero-copy">
          <p class="hero-badge">Xiao Wan Device Access</p>
          <h1>小丸设备接入</h1>
          <p class="hero-subtitle">从已发现的机器人里选择一台，连接后进入设备设置页。</p>
        </div>
        <div class="hero-status-card setup-status-card">
          <p class="hero-status-label">返回入口</p>
          <a class="setup-back-link" href="../index.html">
            <i class="fa-solid fa-reply"></i>
            <span>返回控制台首页</span>
          </a>
          <p class="panel-subtitle">这里主要负责挑选机器人并建立 SDK 会话。</p>
        </div>
      </section>

      <div class="section-panel sdk-compact-panel">
        <div class="sdk-panel-header">
          <div>
            <p class="hero-badge">Device Session</p>
            <h2>选择机器人</h2>
            <p class="panel-subtitle">选中一台机器人后点击连接，即可进入设备侧设置与控制页面。</p>
          </div>
        </div>
        <hr class="small-hr" />
        <div class="sdk-form-stack">
          <select id="botList" name="botList"></select>
          <div class="sdk-button-row">
            <button onclick="connectSDK()">连接设备</button>
          </div>
        </div>
        <hr />
        <div id="authResult"></div>
      </div>
    </div>
  </div>
<iframe name="hiddenFrame" width="0" height="0" border="0" style="display: none"></iframe>
<script src="./js/httprequest.js"></script>
<script src="./js/common.js"></script>
<script src="../js/ui.js"></script>
<script src="./js/auth.js"></script>
</body>

</html>
