<!DOCTYPE html>
<html>

<head>
    
  <title>Wire-Pod 初始设置</title>
  <!-- Meta Apple tags for a PWA like experience. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="stylesheet" type="text/css" href="css/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/7508f396ac.js" crossorigin="anonymous"></script>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
</head>

<body>
  <div id="outer">
    <div id="content" class="page-shell">
      <section class="home-hero">
        <div class="hero-copy">
          <p class="hero-badge">Wire-Pod First Run</p>
          <h1>Wire-Pod 初始设置</h1>
          <p class="hero-subtitle">先完成最基础的连接方式设置，提交后就能进入完整控制台。</p>
        </div>
        <div class="hero-status-card setup-status-card">
          <p class="hero-status-label">初始化状态</p>
          <div id="setup-status" class="status-strip"></div>
          <p class="panel-subtitle">初始化完成后，更多模型、记忆与天气设置都可以在控制台继续调整。</p>
        </div>
      </section>
      <div id="config-options" class="section-panel section-stack" style="display: block">
        <p class="page-lead">欢迎使用 wire-pod。先把最基础的通信方式确定下来，再点击底部按钮提交。</p>
        <div id="section-conn" class="fieldset-card" style="display: block">
          <h3>连接方式</h3>
          <hr class="small-hr">
          <div class="center" id="connStatus"></div>
          <select onchange="checkConn()" name="connSelection" id="connSelection">
            <option value="ep">
              Escape Pod（适合普通量产机器人）
            </option>
            <option value="ip">
              IP 地址（适合 OSKR / 开发解锁机器人）
            </option>
          </select>
          <div class="center" id="portViz" style="display: none">
            <label for="portInput">自定义端口（默认 443）</label>
            <input type="text" id="portInput" name="portInput" placeholder="443" />
          </div>
          <hr />
        </div>

        <div class="setup-note">
          <strong>提示：</strong>BigModel 的 STT / LLM / TTS Key 与模型参数，现在都统一在“服务器设置”页面中配置，
          不需要再去脚本里手动输入 token。
        </div>
        <small class="desc">天气、大模型和 BigModel 公共配置，可以在初始化完成后进入“服务器设置”页面继续填写。</small>
        <hr />

        <button onclick="sendSetupInfo()">
          提交设置
        </button>
      </div>
    </div>
  </div>
</body>
<script src="./js/ui.js"></script>
<script src="./js/main.js"></script>
<script src="./js/initial.js"></script>
<!-- <script src="./sdkapp/js/main.js"></script> -->

</html>
