<!DOCTYPE html>
<html>

<head>
  <title>Wire-Pod 初始设置</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="stylesheet" type="text/css" href="css/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/7508f396ac.js" crossorigin="anonymous"></script>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
</head>

<body>
  <div id="outer">
    <div id="content" class="page-shell">
      <section class="home-hero">
        <div class="hero-copy hero-copy-rich">
          <p class="hero-badge">Wire-Pod First Run</p>
          <h1>Wire-Pod 初始设置</h1>
          <p class="hero-subtitle">选连接方式，保存后进入主页。</p>
          <div class="hero-pills">
            <span>Escape Pod</span>
            <span>IP 接入</span>
          </div>
        </div>
        <div class="hero-status-card setup-status-card">
          <p class="hero-status-label">当前状态</p>
          <div id="setup-status" class="status-strip"></div>
        </div>
      </section>

      <div id="config-options" class="section-panel section-stack section-panel-wide" style="display: block">
        <div class="section-heading section-heading-inline">
          <div>
            <p class="section-kicker">Connection</p>
            <h3>连接方式</h3>
          </div>
          <p>量产机选 Escape Pod，开发机选 IP。</p>
        </div>

        <div id="section-conn" class="fieldset-card stack-tight" style="display: block">
          <div class="center" id="connStatus"></div>
          <div class="form-grid">
            <div>
              <label for="connSelection">连接模式</label>
              <select onchange="checkConn()" name="connSelection" id="connSelection">
                <option value="ep">Escape Pod（量产机）</option>
                <option value="ip">IP 地址（OSKR / 开发机）</option>
              </select>
            </div>
            <div id="portViz" style="display: none">
              <label for="portInput">端口（默认 443）</label>
              <input type="text" id="portInput" name="portInput" placeholder="443" />
            </div>
          </div>
        </div>

        <div class="panel-actions">
          <button onclick="sendSetupInfo()">保存并继续</button>
        </div>
      </div>
    </div>
  </div>
</body>
<script src="./js/ui.js"></script>
<script src="./js/main.js"></script>
<script src="./js/initial.js"></script>

</html>
