<!DOCTYPE html>
<html>

<head>
  <title>Wire-Pod 初始设置</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="stylesheet" type="text/css" href="css/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/7508f396ac.js" crossorigin="anonymous"></script>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
</head>

<body>
  <div id="outer">
    <div id="content" class="page-shell initial-shell">
      <section class="initial-card">
        <div class="initial-head">
          <h1>初始设置</h1>
        </div>

        <div id="setup-status" class="status-strip initial-status"></div>

        <div id="config-options" class="initial-config" style="display: block">
          <div class="initial-form-stack">
            <div class="initial-field">
              <label for="connSelection">连接方式</label>
              <select onchange="checkConn()" name="connSelection" id="connSelection">
                <option value="ep">Escape Pod</option>
                <option value="ip">IP 地址</option>
              </select>
            </div>

            <div id="portViz" class="initial-field" style="display: none">
              <label for="portInput">端口</label>
              <input type="text" id="portInput" name="portInput" placeholder="443" />
            </div>

            <div class="panel-actions initial-actions">
              <button onclick="sendSetupInfo()">保存并继续</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
</body>
<script src="./js/ui.js"></script>
<script src="./js/main.js"></script>
<script src="./js/initial.js"></script>

</html>
