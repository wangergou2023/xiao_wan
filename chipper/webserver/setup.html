<!DOCTYPE html>
<html>

<head>
  <title>小丸设置台</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="stylesheet" type="text/css" href="css/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/7508f396ac.js" crossorigin="anonymous"></script>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
</head>

<body>
  <div id="outer">
    <div id="content" class="page-shell minimal-shell">
      <section class="minimal-topbar minimal-topbar-tight">
        <div class="minimal-titleblock">
          <p class="minimal-kicker">Xiao Wan</p>
          <h1>服务设置</h1>
          <p class="minimal-copy">按需打开模块，改完就保存。</p>
        </div>
        <div class="minimal-statusblock minimal-backblock">
          <a class="setup-back-link" href="index.html">
            <i class="fa-solid fa-reply"></i>
            <span>返回控制台</span>
          </a>
        </div>
      </section>

      <section class="minimal-section">
        <div class="minimal-tabbar">
          <a href="#" onclick="showKG(); return false;" class="minimal-tab" data-section="section-kg">
            <i class="fa-solid fa-diagram-project" id="icon-KG" name="icon"></i>
            <span>模型</span>
          </a>
          <a href="#" onclick="showMemory(); return false;" class="minimal-tab" data-section="section-memory">
            <i class="fa-solid fa-brain" id="icon-Memory" name="icon"></i>
            <span>记忆</span>
          </a>
          <a href="#" onclick="showWeather(); return false;" class="minimal-tab" data-section="section-weather">
            <i class="fa-solid fa-cloud-sun" id="icon-Weather" name="icon"></i>
            <span>天气</span>
          </a>
          <a href="#" onclick="showRestart(); return false;" class="minimal-tab" data-section="section-restart">
            <i class="fa-solid fa-rotate-right" id="icon-Restart" name="icon"></i>
            <span>维护</span>
          </a>
        </div>
      </section>

      <div id="section-weather" style="display: none">
        <div class="section-panel section-stack section-panel-wide minimal-panel structured-panel">
          <div class="minimal-panel-head">
            <h2>天气接口</h2>
            <p>要问天气时再配置。</p>
          </div>
          <div class="minimal-cardblock">
            <div id="addWeatherProviderAPI"></div>
            <form id="weatherAPIAddForm" class="form-grid">
              <div>
                <label for="weatherProvider">天气服务提供商</label>
                <select name="weatherProvider" id="weatherProvider" form="weatherAPIAddForm" onchange="checkWeather()">
                  <option value="" selected>无</option>
                  <option value="openweathermap.org">OpenWeatherMap</option>
                  <option value="weatherapi.com">WeatherAPI</option>
                </select>
              </div>
              <div id="apiKeySpan" style="display: none">
                <label for="apiKey">API Key</label>
                <input class="tinput" type="text" name="apiKey" id="apiKey" />
              </div>
            </form>
            <div class="panel-actions">
              <button onclick="sendWeatherAPIKey()">保存天气</button>
            </div>
            <div id="addWeatherProviderAPIStatus" class="status-card"></div>
          </div>
        </div>
      </div>

      <div id="section-kg" style="display: none">
        <div class="section-panel section-stack section-panel-wide minimal-panel structured-panel">
          <div class="minimal-panel-head">
            <h2>大模型</h2>
            <p>先选提供商，再补公共参数。</p>
          </div>

          <div class="minimal-cardblock">
            <div id="addKGProviderAPI" class="status-card"></div>
            <form id="kgAPIAddForm" class="stack-tight">
              <div class="form-grid">
                <div>
                  <label for="kgProvider">大模型提供商</label>
                  <select name="kgProvider" id="kgProvider" form="kgAPIAddForm" onchange="checkKG()">
                    <option value="" selected>无</option>
                    <option value="bigmodel">BigModel</option>
                    <option value="openai">OpenAI</option>
                    <option value="custom">自定义接口</option>
                  </select>
                </div>
              </div>

              <div id="openAIInput" class="provider-panel">
                <div class="minimal-subhead">
                  <h3>OpenAI</h3>
                </div>
                <div class="form-grid">
                  <div>
                    <label for="openaiKey">API Key</label>
                    <input type="text" name="openaiKey" id="openaiKey" placeholder="sk-..." />
                  </div>
                  <div>
                    <label for="openAIPrompt">系统提示词</label>
                    <input type="text" name="openAIPrompt" id="openAIPrompt" placeholder="留空则使用默认提示词" />
                  </div>
                </div>
              </div>

              <div id="bigModelInput" class="provider-panel">
                <div class="minimal-subhead">
                  <h3>BigModel</h3>
                </div>
                <div class="form-grid">
                  <div>
                    <label for="bigmodelKey">API Key</label>
                    <input type="text" name="bigmodelKey" id="bigmodelKey" placeholder="留空则复用下方公共配置" />
                  </div>
                  <div>
                    <label for="bigmodelModel">模型名称</label>
                    <input type="text" name="bigmodelModel" id="bigmodelModel" placeholder="glm-5.1" />
                  </div>
                  <div class="form-grid-span-2">
                    <label for="bigmodelPrompt">系统提示词</label>
                    <input type="text" name="bigmodelPrompt" id="bigmodelPrompt" placeholder="留空则使用默认提示词" />
                  </div>
                </div>
              </div>

              <div id="customAIInput" class="provider-panel">
                <div class="minimal-subhead">
                  <h3>自定义兼容接口</h3>
                </div>
                <div class="form-grid">
                  <div>
                    <label for="customKey">API Key</label>
                    <input type="text" name="customKey" id="customKey" placeholder="例如 ollama" />
                  </div>
                  <div>
                    <label for="customAIEndpoint">接口地址</label>
                    <input type="text" name="customAIEndpoint" id="customAIEndpoint" placeholder="http://localhost:11434/v1" />
                  </div>
                  <div>
                    <label for="customModel">模型名称</label>
                    <input type="text" name="customModel" id="customModel" placeholder="例如 llama3" />
                  </div>
                  <div>
                    <label for="customAIPrompt">系统提示词</label>
                    <input type="text" name="customAIPrompt" id="customAIPrompt" placeholder="留空则使用默认提示词" />
                  </div>
                </div>
              </div>

              <div id="llmDefaultsNote" class="setup-note" style="display: none;">
                <strong>默认行为：</strong>保存后会启用回退、动作和对话记忆。需要时可 <a href="#" onclick="deleteSavedChats(); return false;">删除已保存对话</a>。
              </div>
            </form>
            <div class="panel-actions">
              <button onclick="sendKGAPIKey()">应用设置</button>
            </div>
          </div>

          <div class="minimal-two-col">
            <div id="bigModelSharedInput" class="minimal-cardblock">
              <div class="minimal-subhead">
                <h3>BigModel 公共参数</h3>
              </div>
              <div class="form-grid">
                <div class="form-grid-span-2">
                  <label for="bigmodelSharedKey">BigModel API Key</label>
                  <input type="text" name="bigmodelSharedKey" id="bigmodelSharedKey" placeholder="填写你的 BigModel API Key" />
                </div>
                <div>
                  <label for="bigmodelASRModel">ASR 模型</label>
                  <input type="text" name="bigmodelASRModel" id="bigmodelASRModel" placeholder="glm-asr-2512" />
                </div>
                <div>
                  <label for="bigmodelSharedLLMModel">默认 LLM 模型</label>
                  <input type="text" name="bigmodelSharedLLMModel" id="bigmodelSharedLLMModel" placeholder="glm-5.1" />
                </div>
                <div>
                  <label for="bigmodelTTSModel">TTS 模型</label>
                  <input type="text" name="bigmodelTTSModel" id="bigmodelTTSModel" placeholder="glm-tts" />
                </div>
                <div>
                  <label for="bigmodelTTSVoice">TTS 音色</label>
                  <input type="text" name="bigmodelTTSVoice" id="bigmodelTTSVoice" placeholder="tongtong" />
                </div>
                <div>
                  <label for="bigmodelTTSSpeed">TTS 语速</label>
                  <input type="text" name="bigmodelTTSSpeed" id="bigmodelTTSSpeed" placeholder="1.0" />
                </div>
                <div>
                  <label for="bigmodelTTSVolume">TTS 音量</label>
                  <input type="text" name="bigmodelTTSVolume" id="bigmodelTTSVolume" placeholder="1.0" />
                </div>
              </div>
              <div class="panel-actions">
                <button onclick="sendBigModelConfig()">保存公共配置</button>
              </div>
              <div id="bigModelConfigStatus" class="status-card"></div>
            </div>

            <div id="visionInput" class="minimal-cardblock">
              <div class="minimal-subhead">
                <h3>视觉上下文</h3>
              </div>
              <label class="toggle-line" for="visionEnableFaceContext">
                <input type="checkbox" id="visionEnableFaceContext" />
                <span>启用人脸上下文</span>
              </label>
              <small class="form-help">识别到已知人脸时，把身份信息交给模型。</small>
              <div class="panel-actions">
                <button onclick="sendVisionConfig()">保存视觉设置</button>
              </div>
              <div id="visionConfigStatus" class="status-card"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="section-memory" style="display: none">
        <div class="section-panel section-stack section-panel-wide minimal-panel structured-panel">
          <div class="minimal-panel-head">
            <h2>长期记忆</h2>
            <p>维护机器人长期读取的文本记忆。</p>
          </div>
          <div class="minimal-cardblock">
            <form id="memoryProfileForm" class="stack-tight">
              <div class="form-grid">
                <div>
                  <label for="memoryRobotESN">机器人</label>
                  <select id="memoryRobotESN" onchange="updateLongTermMemory()"></select>
                </div>
              </div>
              <div>
                <label for="memoryText">长期记忆内容</label>
                <textarea id="memoryText" rows="14" placeholder="例如&#10;- 主人叫王二狗&#10;- 家住东北&#10;- 打招呼时可以自然一点&#10;- 喜欢聊做饭、日常、机器人"></textarea>
              </div>
            </form>
            <div class="panel-actions">
              <button onclick="saveLongTermMemory()">保存长期记忆</button>
            </div>
            <div id="memoryStatus" class="status-card"></div>
          </div>
        </div>
      </div>

      <div id="section-restart" style="display: none">
        <div class="section-panel section-stack section-panel-wide minimal-panel structured-panel">
          <div class="minimal-panel-head">
            <h2>重启 Wire-Pod</h2>
            <p>改完关键配置后，可在这里重启。</p>
          </div>
          <div id="restart"></div>
          <div class="panel-actions">
            <button onclick="sendRestart()">重启 Wire-Pod</button>
          </div>
          <div id="restartStatus" class="status-card"></div>
        </div>
      </div>
    </div>
  </div>
</body>
<script src="./js/ui.js"></script>
<script src="./js/main.js"></script>
<script>
  updateWeatherAPI();
  updateKGAPI();
  updateBigModelConfig();
  updateVisionConfig();
  updateLongTermMemory();
</script>

</html>
